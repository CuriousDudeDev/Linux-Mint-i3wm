[bar/main]
monitor = 
width = 100%
height = 30
offset-x = 0
offset-y = 0
background = #1e1e2e
foreground = #cdd6f4

; Use Font Awesome for icons, monospace for text
font-0 = "FontAwesome:size=11;2"
font-1 = monospace:size=10;2

; Modules
modules-left = i3
modules-center = date
modules-right = pulseaudio tray battery

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-focused = %name%
label-focused-background = #89b4fa
label-focused-foreground = #1e1e2e
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = #a6adc8
label-unfocused-padding = 2

[module/date]
type = internal/date
interval = 1
date = " %Y-%m-%d"
time = " %I:%M:%S %p"
label =  %date% %time%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume> <ramp-volume>
label-volume = 
label-muted = 
label-muted-foreground = #f38ba8
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
format-volume-padding = 1
format-muted-padding = 1

[module/network]
type = internal/network
interface-type = wireless
interval = 3.0
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = 
label-disconnected = 
label-disconnected-foreground = #f38ba8
; This makes clicking the icon open the network manager!
click-left = xfce4-terminal -e "nmtui" &
format-connected-padding = 1
format-disconnected-padding = 1
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
; Added %percentage%% here so you can see the number!
format-charging = <label-charging> <ramp-capacity>
format-discharging = <label-discharging> <ramp-capacity>
format-full = <label-full> 
label-charging =  %percentage%%
label-discharging =  %percentage%%
label-full =  %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
format-charging-padding = 1
format-discharging-padding = 1
format-full-padding = 1

[module/tray]
type = internal/tray
tray-padding = 2
